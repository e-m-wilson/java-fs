# Your ECS service runs a task from a task definition. 
#That definition tells ECS which container image to run and which configuration values to provide.
# In ECS → Task definitions → your task definition → Create new revision, configure the container's environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/student_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# NONE OF THESE ARE A REPLACEMENT FOR A FULL MIGRATION TOOL LIKE FLYWAY
# THESE ARE GOOD FOR PROTOTYPING 
# this makes hibernate try and update the db schema to match
# our entities on the server side
spring.jpa.hibernate.ddl-auto=update

# don't modify anything. just check whether the existing schema matches my mappings
#spring.jpa.hibernate.ddl-auto=validate

# drop and recreate the schema every time the application starts
#spring.jpa.hibernate.ddl-auto=create

# create the schema on startup and drops it when the application shuts down
#spring.jpa.hibernate.ddl-auto=create-drop


# this sets the lifespan of the JSESSIONID HttpOnly cookie on the browser
# this is the cookie we get right after hitting the login route
server.servlet.session.cookie.max-age=8h

# this enables HttpOnly cookies for our session cookie 
# we recieve after login 
server.servlet.session.cookie.http-only=true

# tells Spring Boot to mark the JSESSIONID session cookie as Secure
# That means the browser should send the cookie only over HTTPS connections, not ordinary HTTP connections
# keeping this off for now while we are in a local environment running over http 
#server.servlet.session.cookie.secure=true

# SameSite for JSESSIONID: Lax allows same-site requests and top-level safe navigation;
# Strict only sends it in same-site contexts; None allows cross-site use and requires Secure/HTTPS.
server.servlet.session.cookie.same-site=lax

# SameSite for the XSRF-TOKEN cookie configured in SecurityConfig.
# Lax works for this local demo; Strict is more restrictive, while None requires Secure/HTTPS.
app.security.csrf-cookie.same-site=Lax

# this is a separate timeout for the session on the server-side
# this session timeout is an inactivity limit, not a hard max session age
server.servlet.session.timeout=30m


