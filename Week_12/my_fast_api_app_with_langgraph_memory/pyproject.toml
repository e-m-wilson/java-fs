[project]
name = "my-fast-api-app-with-langgraph-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Wilson", email = "ethanwilson1991@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "docx2txt>=0.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary,pool]>=3.3.7",
    "pydantic>=2.14.2",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-utils>=0.43.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
my-fast-api-app-with-langgraph-memory = "my_fast_api_app_with_langgraph_memory:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
